<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | Tap to Connect</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    background:#f5f7fb;
    font-family:Arial, sans-serif;
    color:#222;
}


/* Header */

.admin-header{

    background:#0066ff;
    color:white;
    padding:20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

}


.admin-header h1{
    color:white;
}



/* Logout */

.logout{

    background:white;
    color:#0066ff;

    border:none;
    padding:10px 20px;

    border-radius:6px;

    cursor:pointer;

    font-weight:bold;

}




.container{

    width:90%;
    max-width:1200px;

    margin:30px auto;

}




/* Cards */

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;

}



.card{

background:white;

padding:25px;

border-radius:12px;

box-shadow:
0 5px 20px rgba(0,0,0,.08);

}



.card h3{

color:#333;

}



.card h2{

font-size:32px;

color:#0066ff;

margin-top:10px;

}



/* Table */

.table-box{

margin-top:30px;

background:white;

padding:20px;

border-radius:12px;

overflow:auto;

}



.table-box h2{

color:#222;

}




table{

width:100%;

border-collapse:collapse;

}




th{

background:#0066ff;

color:white;

padding:14px;

text-align:left;

}




td{

color:#333;

padding:14px;

border-bottom:1px solid #ddd;

}




tbody tr:hover{

background:#f2f6ff;

}




@media(max-width:600px){

.admin-header{

flex-direction:column;

gap:15px;

}


}


</style>

</head>



<body>


<header class="admin-header">

<h1>
Tap to Connect Admin
</h1>


<button class="logout" id="logoutBtn">
Logout
</button>


</header>




<div class="container">



<div class="cards">


<div class="card">

<h3>
Total Stickers
</h3>

<h2 id="totalCount">
0
</h2>

</div>




<div class="card">

<h3>
Activated
</h3>

<h2 id="activeCount">
0
</h2>

</div>




<div class="card">

<h3>
Users
</h3>

<h2 id="userCount">
0
</h2>

</div>



</div>





<div class="table-box">


<h2>
Sticker Details
</h2>


<br>



<table>


<thead>

<tr>

<th>
Sticker ID
</th>


<th>
Name
</th>


<th>
Vehicle
</th>


<th>
Mobile
</th>


<th>
Status
</th>


</tr>

</thead>



<tbody id="userTable">


</tbody>



</table>



</div>




</div>




<script type="module" src="admin.js"></script>


</body>

</html>
