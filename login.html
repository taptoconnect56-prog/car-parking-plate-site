<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Tap to Connect</title>

    <link rel="stylesheet" href="style.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{
            background:#f5f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            width:400px;
            max-width:90%;
            background:#fff;
            padding:40px;
            border-radius:12px;
            box-shadow:0 10px 30px rgba(0,0,0,.1);
        }

        h1{
            text-align:center;
            margin-bottom:10px;
        }

        p{
            text-align:center;
            color:#666;
            margin-bottom:30px;
        }

        .form-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:14px;
            border:1px solid #ddd;
            border-radius:8px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:15px;
            background:#0066ff;
            color:#fff;
            border:none;
            border-radius:8px;
            font-size:17px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#004ecc;
        }

        #message{
            margin-top:20px;
            text-align:center;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="login-box">

<h1>Admin Login</h1>

<p>Tap to Connect Dashboard</p>

<form id="loginForm">

<div class="form-group">
<label>Email</label>

<input
type="email"
id="email"
value="taptoconnect56@gmail.com"
required>
</div>

<div class="form-group">
<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter Password"
required>
</div>

<button type="submit">
Login
</button>

<div id="message"></div>

</form>

</div>

<script type="module" src="login.js"></script>

</body>
</html>
